# @dsh-external/dsh-tool-manager 的组合包(bundle)层。
#
# 声明 dsh.bundle.patch 后,本文件成为该包在 profile 组合中的一层 patch:
# profile 的 dsh.profile.bundles 列出本包时,dsh 会按序应用这里的 patch 条目,
# 插件因此以「标准插件」身份被装配——出现在插件列表、启停入口与
# 「内置插件」清单里,不再依赖运行时注入(幽灵 entry)。
#
# 浏览器半侧(client)由 package.json 的 dsh.client 声明按 platform 自动送出,
# 不需要在这里登记;本文件只登记宿主半侧的那一行。
#
# id 在整个 profile 组合里必须唯一;config 留空对象,插件自身对未声明字段有兜底。
- insert:
    - id: dsh-tool-manager
      name: '@dsh-external/dsh-tool-manager'
      config: {}
